<g><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.643;1" dur="1.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1"/>
  <text x="44" y="386" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#93A0B8" opacity="1" >the estuary in front, the code behind — every line written since crossed this gap</text>
</g>
<g><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.786;1" dur="1.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1"/>
  <text x="736" y="386" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#5B6B84" opacity="1" text-anchor="end">HATIYA → DHAKA · EST. 2009</text>
