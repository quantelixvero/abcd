  <text x="660" y="290" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#5B6B84" opacity="1" text-anchor="middle">23°48′N · 90°24′E</text>
</g>
<g>
  <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
