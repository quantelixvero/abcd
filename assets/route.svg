    <animate attributeName="r" values="9;18" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
