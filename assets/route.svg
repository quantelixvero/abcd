<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img">
<defs>
  <filter id="gl4"><feGaussianBlur stdDeviation="3"/></filter>
  <path id="rte" d="M120,250 C300,150 480,330 660,230" fill="none"/>
</defs>
<rect x="1" y="1" width="778" height="428" rx="18" fill="#0A1120" stroke="#1C2B45" stroke-width="1.5"/>
<text x="44" y="56" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="14" font-weight="400" fill="#FFB454" opacity="1" letter-spacing="3.5" >THE CROSSING — HATIYA → DHAKA</text>
<text x="736" y="56" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#5B6B84" opacity="1" letter-spacing="1.5" text-anchor="end">CHAIRMAN GHAT · NALCHIRA · MAIJDEE</text>
<line x1="44" y1="82" x2="736" y2="82" stroke="#1C2B45" stroke-width="1"/>
<use href="#rte" stroke="#1C2B45" stroke-width="2" fill="none"/>
<use href="#rte" stroke="#FFB454" stroke-width="2" fill="none" stroke-dasharray="6 10" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" values="0;-160" dur="6s" repeatCount="indefinite"/></use>
<g>
  <circle cx="120" cy="250" r="7" fill="#FFB454"/>
  <circle cx="120" cy="250" r="14" fill="none" stroke="#FFB454" stroke-opacity="0.4" stroke-width="1.5">
    <animate attributeName="r" values="9;18" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/></circle>
  <text x="120" y="290" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#EAEFF7" opacity="1" text-anchor="middle">HATIYA ISLAND</text>
  <text x="120" y="310" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#5B6B84" opacity="1" text-anchor="middle">22°40′N · 91°00′E</text>
</g>
<g>
  <circle cx="660" cy="230" r="7" fill="#FFB454"/>
